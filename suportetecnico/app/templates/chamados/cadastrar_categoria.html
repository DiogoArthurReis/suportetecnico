
{% extends 'chamados/base.html' %}

{% block content %}

<div class="page-heading">
    <div>
        <h1>Cadastrar Categoria</h1>
        <p>Preencha os dados para adicionar uma nova categoria.</p>
    </div>
</div>

<div class="form-container">

    {% if erro %}
        <div class="error-message">
            {{ erro }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="nome">Nome da Categoria</label>
            <input
                type="text"
                name="nome"
                id="nome"
                value="{{ dados.nome|default:'' }}"
                maxlength="100"
                placeholder="Ex.: Hardware"
                required
            >
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">
                Cadastrar Categoria
            </button>

            <a href="{% url 'lista_categorias' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>
    </form>

</div>

{% endblock %}
