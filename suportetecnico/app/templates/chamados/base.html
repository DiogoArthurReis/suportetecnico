
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Chamados{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'app/css/style.css' %}">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <h2>SUPORTE TÉCNICO</h2>
        <p class="subtitle">Sistema de gerenciamento</p>

        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'lista_chamados' %}">Chamados</a>

        {% if request.user.is_authenticated %}
            <a href="{% url 'logout' %}" class="logout">Sair do sistema</a>
        {% endif %}
    </aside>

    <main class="main">
        {% block content %}
        {% endblock %}
    </main>

</div>

</body>
</html>
