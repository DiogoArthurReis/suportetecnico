<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Abrir Chamado</title>
</head>

<body>

    <h1>Sistema de Chamados para Suporte Técnico</h1>

    <hr>

    <h2>Abrir Novo Chamado</h2>

    <form method="POST">

        {% csrf_token %}

        <label for="titulo">
            <strong>Título:</strong>
        </label>

        <br>

        <input
            type="text"
            name="titulo"
            id="titulo"
            maxlength="150"
            required
        >

        <br><br>


        <label for="descricao">
            <strong>Descrição:</strong>
        </label>

        <br>

        <textarea
            name="descricao"
            id="descricao"
            rows="6"
            cols="60"
            required
        ></textarea>

        <br><br>


        <label for="solicitante">
            <strong>Solicitante:</strong>
        </label>

        <br>

        <select name="solicitante" id="solicitante" required>

            <option value="">
                Selecione o solicitante
            </option>

            {% for usuario in usuarios %}

                <option value="{{ usuario.id }}">
                    {{ usuario.nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>


        <label for="setor">
            <strong>Setor:</strong>
        </label>

        <br>

        <select name="setor" id="setor" required>

            <option value="">
                Selecione o setor
            </option>

            {% for setor in setores %}

                <option value="{{ setor.id }}">
                    {{ setor.nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>


        <label for="categoria">
            <strong>Categoria:</strong>
        </label>

        <br>

        <select name="categoria" id="categoria" required>

            <option value="">
                Selecione a categoria
            </option>

            {% for categoria in categorias %}

                <option value="{{ categoria.id }}">
                    {{ categoria.nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>


        <label for="prioridade">
            <strong>Prioridade:</strong>
        </label>

        <br>

        <select name="prioridade" id="prioridade" required>

            {% for valor, nome in prioridades %}

                <option value="{{ valor }}">
                    {{ nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Abrir Chamado
        </button>

    </form>

    <br>

    <a href="/chamados/">
        Cancelar
    </a>

</body>

</html>
